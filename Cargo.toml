[package]
name = "lijing"
version = "0.15.0"
edition = "2021"
description = "麗京特別市 城市圖鑑（原生版）"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.37"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = "0.17"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
